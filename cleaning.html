<!DOCTYPE html>
<html lang="en" data-section="lower" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1565c0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Newberry Cleaning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  min-height: 100dvh;
  padding-bottom: env(safe-area-inset-bottom, 20px);
  transition: background .3s, color .3s;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}

:root {
  --bg: #f7f6f3;
  --card: #ffffff;
  --border: #e6e3db;
  --border-light: #f0ede6;
  --text: #1c1c1e;
  --text-secondary: #48484a;
  --muted: #8e8e93;
  --shadow: 0 1px 2px rgba(0,0,0,.03), 0 2px 6px rgba(0,0,0,.04);
  --shadow-lg: 0 4px 16px rgba(0,0,0,.07), 0 1px 3px rgba(0,0,0,.04);
  --font-head: 'DM Serif Display', Georgia, serif;
  --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --badge-bg: rgba(0,0,0,.04);
  --red: #c62828;
  --green: #2e7d32;
  --green-light: rgba(46,125,50,.08);
  --toast-bg: #2c2c2e;
  --toast-color: #f2f2f7;
  --overlay: rgba(0,0,0,.4);
  --radius: 12px;
  --radius-lg: 16px;
}

[data-theme="dark"] {
  --bg: #111113;
  --card: #1c1c1e;
  --border: #2c2c2e;
  --border-light: #232325;
  --text: #f2f2f7;
  --text-secondary: #aeaeb2;
  --muted: #6e6e73;
  --shadow: 0 1px 3px rgba(0,0,0,.4), 0 2px 8px rgba(0,0,0,.3);
  --shadow-lg: 0 4px 16px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.3);
  --badge-bg: rgba(255,255,255,.06);
  --green-light: rgba(46,125,50,.15);
  --toast-bg: #f2f2f7;
  --toast-color: #1c1c1e;
  --overlay: rgba(0,0,0,.6);
}

[data-section="lower"]       { --pk: #e91e63; --pk-light: rgba(233,30,99,.08); --pk-mid: rgba(233,30,99,.15); --glow: rgba(233,30,99,.35); }
[data-section="upper"]       { --pk: #1565c0; --pk-light: rgba(21,101,192,.08); --pk-mid: rgba(21,101,192,.15); --glow: rgba(21,101,192,.35); }
[data-section="support"]     { --pk: #546e7a; --pk-light: rgba(84,110,122,.08); --pk-mid: rgba(84,110,122,.15); --glow: rgba(84,110,122,.35); }

.app-header {
  padding: calc(14px + env(safe-area-inset-top, 0px)) 16px 10px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 90; background: var(--bg);
}
.section-tabs { position: sticky; top: calc(52px + env(safe-area-inset-top, 0px)); z-index: 89; background: var(--bg); }
.logo { display: flex; flex-direction: column; }
.logo-title {
  font-family: var(--font-head); font-size: 23px; font-weight: 400;
  color: var(--pk); line-height: 1.1; letter-spacing: -.2px;
}
.logo-sub {
  font-size: 9px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 3px; color: var(--muted); margin-top: 3px;
}
.header-actions { display: flex; gap: 4px; align-items: center; }
.header-btn {
  width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid var(--border);
  background: var(--card); color: var(--muted); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all .2s; position: relative; box-shadow: 0 1px 3px rgba(0,0,0,.04);
}
.header-btn:hover { color: var(--text); border-color: var(--pk); box-shadow: 0 2px 8px var(--glow); }
.header-btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.header-btn.active { background: var(--pk); color: #fff; border-color: var(--pk); }

.overflow-wrap { position: relative; }
.overflow-menu {
  position: absolute; top: 100%; right: 0; margin-top: 6px;
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: 0 8px 24px rgba(0,0,0,.1), 0 2px 6px rgba(0,0,0,.04); min-width: 170px; z-index: 100;
  display: none; overflow: hidden;
}
.overflow-menu.open { display: block; }
.overflow-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; border: none; background: none; width: 100%;
  font-size: 13px; color: var(--text); cursor: pointer;
  font-family: var(--font-body); transition: background .15s; text-align: left;
}
.overflow-item:hover { background: var(--pk-light); }
.overflow-item svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

.section-tabs {
  display: flex; gap: 3px; padding: 4px 16px 6px;
  overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
}
.section-tabs::-webkit-scrollbar { display: none; }
.section-tab {
  flex: 1; display: flex; align-items: center; justify-content: center; gap: 5px;
  padding: 8px 12px; border: none; background: transparent; border-radius: 10px;
  cursor: pointer; font-family: var(--font-body); font-size: 10px; font-weight: 700;
  color: var(--muted); text-transform: uppercase; letter-spacing: .5px;
  transition: all .22s; user-select: none; white-space: nowrap;
}
.section-tab:hover { color: var(--text); background: var(--badge-bg); }
.section-tab.active { background: var(--pk); color: #fff; box-shadow: 0 3px 12px var(--glow); }
.tab-badge {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px;
  font-size: 9px; font-weight: 700; background: var(--badge-bg); color: var(--muted);
}
.section-tab.active .tab-badge { background: rgba(255,255,255,.3); color: #fff; }

.stats-bar { padding: 8px 16px; display: flex; align-items: center; gap: 12px; }
.stats-date { font-size: 13px; font-weight: 600; color: var(--text); }
.stats-progress { flex: 1; display: flex; align-items: center; gap: 8px; }
.progress-track { flex: 1; height: 4px; background: var(--badge-bg); border-radius: 2px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--pk), color-mix(in srgb, var(--pk) 80%, #fff)); border-radius: 2px; transition: width .4s ease; }
.progress-label { font-size: 11px; font-weight: 700; color: var(--pk); white-space: nowrap; }

.filter-bar { padding: 2px 16px 8px; display: flex; gap: 6px; align-items: center; }
.shift-chip {
  padding: 5px 14px; border-radius: 20px; border: 1.5px solid var(--border);
  background: transparent; font-size: 11px; font-weight: 600; color: var(--muted);
  cursor: pointer; transition: all .2s; font-family: var(--font-body);
}
.shift-chip.active { background: var(--pk); color: #fff; border-color: var(--pk); box-shadow: 0 2px 6px var(--glow); }
.search-box {
  flex: 1; max-width: 180px; padding: 5px 10px; border: 1.5px solid var(--border);
  border-radius: 20px; background: var(--card); color: var(--text);
  font-size: 12px; font-family: var(--font-body); outline: none; transition: border-color .2s;
}
.search-box:focus { border-color: var(--pk); }
.search-box::placeholder { color: var(--muted); }

.room-list { padding: 0 12px 100px; display: flex; flex-direction: column; gap: 4px; }
.section-group-header {
  font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px;
  color: var(--muted); padding: 12px 4px 4px; display: flex; align-items: center; gap: 8px;
}
.section-group-header:first-child { padding-top: 4px; }
.section-group-header .sgh-dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
}
.room-card {
  background: var(--card); border: 1px solid var(--border-light);
  border-radius: var(--radius); overflow: hidden; transition: all .2s;
  box-shadow: var(--shadow);
}
.room-card:hover { border-color: var(--border); box-shadow: var(--shadow-lg); }
.room-card.expanded { border-color: var(--pk); box-shadow: 0 2px 12px var(--glow); }
.room-card.complete { border-left: 3px solid var(--green); }
.room-card.complete.expanded { border-color: var(--green); border-left: 3px solid var(--green); box-shadow: 0 2px 12px rgba(46,125,50,.15); }

.room-card-header {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; cursor: pointer; user-select: none; transition: background .15s;
}
.room-card-header:active { background: var(--pk-light); }
.room-card.complete .room-card-header { background: var(--green-light); }

.room-check-icon {
  width: 20px; height: 20px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.room-card:not(.complete) .room-check-icon { border: 2px solid var(--border); color: transparent; }
.room-card.complete .room-check-icon { background: var(--green); color: #fff; border: none; }
.room-check-icon svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }

.room-info { flex: 1; min-width: 0; }
.room-name {
  font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.2;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.room-subtitle { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
.room-fraction { font-size: 10px; font-weight: 600; color: var(--muted); }
.room-staff-badge {
  font-size: 9px; font-weight: 600; color: var(--pk);
  background: var(--pk-light); border-radius: 10px; padding: 1px 6px;
}
.room-done-time {
  font-size: 9px; font-weight: 600; color: var(--green);
  background: var(--green-light); border-radius: 10px; padding: 1px 6px;
}

.room-progress-mini { width: 36px; height: 36px; position: relative; flex-shrink: 0; }
.room-progress-mini svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.room-progress-mini .track { fill: none; stroke: var(--badge-bg); stroke-width: 3; }
.room-progress-mini .fill { fill: none; stroke: var(--pk); stroke-width: 3; stroke-linecap: round; transition: stroke-dashoffset .4s ease; }
.room-card.complete .room-progress-mini .fill { stroke: var(--green); }
.room-progress-mini .pct {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-size: 9px; font-weight: 700; color: var(--muted);
}

.room-est {
  font-size: 9px; font-weight: 600; color: var(--muted); white-space: nowrap;
  flex-shrink: 0; cursor: default;
}
.edit-mode-active .room-est { cursor: pointer; color: var(--pk); text-decoration: underline dashed var(--pk-mid); }
.room-chevron {
  width: 20px; height: 20px; color: var(--muted); flex-shrink: 0; transition: transform .2s;
}
.room-card.expanded .room-chevron { transform: rotate(180deg); }
.room-chevron svg { width: 100%; height: 100%; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.room-body {
  max-height: 0; overflow: hidden; transition: max-height .3s ease;
  border-top: 0px solid transparent;
}
.room-card.expanded .room-body { max-height: 800px; border-top: 1px solid var(--border-light); }

.checklist-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 12px; border-bottom: 1px solid var(--border-light);
  cursor: pointer; transition: background .12s; user-select: none;
}
.checklist-item:last-child { border-bottom: none; }
.checklist-item:active { background: var(--pk-light); }
.check-box {
  width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--border);
  flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  transition: all .2s; color: transparent;
}
.checklist-item.checked .check-box { background: var(--pk); border-color: var(--pk); color: #fff; box-shadow: 0 1px 4px var(--glow); }
.check-box svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.check-label { font-size: 13px; color: var(--text); transition: all .15s; flex: 1; }
.checklist-item.checked .check-label { text-decoration: line-through; color: var(--muted); }
.check-time { font-size: 9px; color: var(--muted); white-space: nowrap; }

.room-actions-bar {
  display: flex; gap: 6px; padding: 8px 12px;
  border-top: 1px solid var(--border-light); align-items: center; flex-wrap: wrap;
}
.room-actions-bar .btn { font-size: 11px; padding: 5px 10px; }

.edit-item-actions { display: none; gap: 4px; margin-left: auto; }
.edit-mode-active .edit-item-actions { display: flex; }
.edit-item-actions button {
  padding: 2px 6px; border-radius: 4px; border: 1px solid var(--border);
  background: var(--card); color: var(--muted); font-size: 10px;
  cursor: pointer; font-family: var(--font-body);
}
.edit-item-actions .edit-del-item { color: var(--red); }
.edit-room-actions { display: none; gap: 4px; }
.edit-mode-active .edit-room-actions { display: flex; }
.edit-room-actions button {
  padding: 3px 8px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--card); color: var(--muted); font-size: 10px; font-weight: 600;
  font-family: var(--font-body); cursor: pointer; transition: all .15s;
}
.edit-room-actions button:hover { color: var(--text); border-color: var(--text); }
.edit-room-actions .edit-delete-room { color: var(--red); }

.add-room-btn {
  display: none; background: var(--badge-bg); border: 2px dashed var(--border);
  border-radius: var(--radius); padding: 12px; cursor: pointer; text-align: center;
  color: var(--muted); font-size: 13px; font-weight: 600;
  transition: all .2s; margin: 4px 12px 8px;
}
.add-room-btn:hover { border-color: var(--pk); color: var(--pk); }
.edit-mode-active .add-room-btn { display: block; }

.add-checklist-row { display: none; padding: 6px 12px; gap: 6px; }
.edit-mode-active .add-checklist-row { display: flex; }
.add-checklist-input {
  flex: 1; padding: 6px 10px; border: 1.5px solid var(--border); border-radius: 6px;
  background: var(--bg); color: var(--text); font-size: 12px;
  font-family: var(--font-body); outline: none;
}
.add-checklist-input:focus { border-color: var(--pk); }

.edit-banner {
  display: none; padding: 6px 16px; background: rgba(230,81,0,.08);
  font-size: 11px; font-weight: 600; color: #e65100; text-align: center; letter-spacing: .2px;
}
.edit-mode-active .edit-banner { display: block; }

.btn {
  padding: 7px 14px; border-radius: 8px; border: none; font-size: 12px;
  font-weight: 600; font-family: var(--font-body); cursor: pointer;
  transition: all .2s; display: inline-flex; align-items: center; gap: 5px;
}
.btn-pk { background: var(--pk); color: #fff; box-shadow: 0 1px 4px var(--glow); }
.btn-pk:hover { filter: brightness(1.08); box-shadow: 0 2px 8px var(--glow); }
.btn-ghost { background: transparent; color: var(--muted); border: 1.5px solid var(--border); }
.btn-ghost:hover { color: var(--text); border-color: var(--text); }
.btn-sm { padding: 4px 8px; font-size: 11px; }
.btn-green { background: var(--green); color: #fff; }
.btn-assign { background: var(--pk-light); color: var(--pk); border: 1px solid var(--pk-mid); }

.panel-overlay {
  position: fixed; inset: 0; z-index: 1000; background: var(--overlay);
  display: none; align-items: center; justify-content: center; padding: 16px;
}
.panel-overlay.open { display: flex; }
.panel {
  background: var(--card); border-radius: var(--radius-lg); width: 100%; max-width: 420px;
  max-height: 80dvh; overflow-y: auto; animation: fadeIn .2s ease;
  box-shadow: 0 8px 32px rgba(0,0,0,.12), 0 2px 8px rgba(0,0,0,.06);
}
@keyframes fadeIn { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: scale(1); } }
.panel-header {
  padding: 14px 16px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.panel-title { font-family: var(--font-head); font-size: 17px; font-weight: 400; }
.panel-body { padding: 8px 16px 16px; }
.staff-row {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 0; border-bottom: 1px solid var(--border-light);
}
.staff-row:last-child { border-bottom: none; }
.staff-name { flex: 1; font-size: 13px; font-weight: 600; }
.staff-count { font-size: 11px; color: var(--muted); }
.staff-edit {
  width: 24px; height: 24px; border: none; background: rgba(21,101,192,.08);
  border-radius: 50%; color: #1565c0; cursor: pointer; font-size: 12px;
  display: flex; align-items: center; justify-content: center;
}
.staff-remove {
  width: 24px; height: 24px; border: none; background: rgba(198,40,40,.08);
  border-radius: 50%; color: var(--red); cursor: pointer; font-size: 12px;
  display: flex; align-items: center; justify-content: center;
}
.add-staff-row { display: flex; gap: 8px; margin-top: 10px; }
.add-staff-input {
  flex: 1; padding: 8px 12px; border: 1.5px solid var(--border); border-radius: 8px;
  background: var(--bg); color: var(--text); font-size: 13px;
  font-family: var(--font-body); outline: none;
}
.add-staff-input:focus { border-color: var(--pk); }
.add-staff-input::placeholder { color: var(--muted); }

.schedule-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.schedule-table th {
  text-align: left; padding: 8px 6px; font-size: 10px; text-transform: uppercase;
  letter-spacing: .5px; color: var(--muted); border-bottom: 1.5px solid var(--border);
}
.schedule-table td { padding: 6px; border-bottom: 1px solid var(--border-light); color: var(--text); }
.schedule-table .sched-room { font-weight: 600; }
.schedule-table .sched-staff { color: var(--pk); }

.modal-overlay {
  position: fixed; inset: 0; z-index: 1000; background: var(--overlay);
  display: none; align-items: flex-end; justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal-sheet {
  background: var(--card); border-radius: 18px 18px 0 0;
  width: 100%; max-width: 500px; overflow-y: auto; padding: 0;
  animation: slideUp .25s ease;
  box-shadow: 0 -4px 24px rgba(0,0,0,.1);
}
@keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.modal-handle { width: 36px; height: 4px; border-radius: 2px; background: var(--border); margin: 10px auto 0; }
.modal-header {
  padding: 10px 16px 8px; display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--border);
}
.modal-title { font-family: var(--font-head); font-size: 17px; font-weight: 400; color: var(--text); }
.modal-close {
  width: 28px; height: 28px; border: none; background: var(--badge-bg);
  border-radius: 50%; color: var(--muted); cursor: pointer; font-size: 15px;
  display: flex; align-items: center; justify-content: center;
}
.modal-close:hover { background: var(--border); color: var(--text); }
.modal-section-title {
  font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px;
  color: var(--muted); padding: 10px 16px 4px;
}
.modal-assign-row { display: flex; gap: 8px; padding: 8px 16px 14px; }
.modal-assign-row select {
  flex: 1; padding: 8px 10px; border: 1.5px solid var(--border);
  border-radius: 8px; background: var(--card); color: var(--text);
  font-size: 13px; font-family: var(--font-body); outline: none;
}
.modal-assign-row select:focus { border-color: var(--pk); }

.empty-state { text-align: center; padding: 50px 20px; color: var(--muted); display: none; }
.empty-state.visible { display: block; }
.empty-state svg { width: 40px; height: 40px; stroke: var(--muted); fill: none; stroke-width: 1.2; margin-bottom: 10px; }
.empty-msg { font-size: 13px; line-height: 1.5; }

.toast {
  position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--toast-bg); color: var(--toast-color);
  padding: 10px 20px; border-radius: 12px; font-size: 12px; font-weight: 600;
  box-shadow: 0 8px 24px rgba(0,0,0,.15); opacity: 0; transition: all .25s;
  z-index: 2000; pointer-events: none; white-space: nowrap;
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.mic-fab {
  position: fixed; bottom: 20px; right: 16px; width: 52px; height: 52px;
  border-radius: 50%; border: none; background: var(--pk);
  color: #fff; cursor: pointer; box-shadow: 0 4px 16px var(--glow);
  display: flex; align-items: center; justify-content: center;
  z-index: 900; transition: transform .15s, box-shadow .2s;
}
.mic-fab:hover { box-shadow: 0 6px 24px var(--glow); }
.mic-fab:active { transform: scale(.92); }
.mic-fab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.mic-fab.recording { background: var(--red); animation: pulse 1s infinite; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(198,40,40,.5); } 50% { box-shadow: 0 0 0 12px rgba(198,40,40,0); } }

@media print {
  .app-header, .section-tabs, .filter-bar, .mic-fab, .toast,
  .header-actions, .modal-overlay, .panel-overlay, .room-actions-bar,
  .edit-banner, .add-room-btn { display: none !important; }
  body { background: #fff; color: #000; }
  .room-card { break-inside: avoid; border: 1px solid #ccc; }
  .room-body { max-height: none !important; }
}
</style>
</head>
<body>

<header class="app-header">
  <div class="logo">
    <div class="logo-title">Newberry<span style="font-weight:400">Cleaning</span></div>
    <div class="logo-sub" id="logo-sub">Classrooms</div>
  </div>
  <div class="header-actions">
    <button class="header-btn" title="Staff" onclick="openStaffPanel()">
      <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    </button>
    <button class="header-btn" id="edit-mode-btn" title="Edit Mode" onclick="toggleEditMode()">
      <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
    </button>
    <div class="overflow-wrap">
      <button class="header-btn" id="more-btn" title="More" onclick="toggleOverflowMenu(event)">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg>
      </button>
      <div class="overflow-menu" id="overflow-menu">
        <button class="overflow-item" onclick="openSchedulePanel();closeOverflowMenu()">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          Schedule
        </button>
        <button class="overflow-item" onclick="exportCSV();closeOverflowMenu()">
          <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Export CSV
        </button>
        <button class="overflow-item" onclick="window.print();closeOverflowMenu()">
          <svg viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
          Print
        </button>
        <button class="overflow-item" onclick="toggleTheme();closeOverflowMenu()">
          <svg id="theme-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          Toggle Theme
        </button>
      </div>
    </div>
  </div>
</header>

<div class="section-tabs" id="section-tabs"></div>
<div class="edit-banner">EDIT MODE — Expand a room to rename, remove, or edit checklist items</div>

<div class="stats-bar">
  <div class="stats-date" id="stats-date"></div>
  <div class="stats-progress">
    <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    <div class="progress-label" id="progress-label">0%</div>
  </div>
</div>

<div class="filter-bar">
  <button class="shift-chip active" data-shift="all" onclick="setShift('all')">All</button>
  <button class="shift-chip" data-shift="morning" onclick="setShift('morning')">Morning</button>
  <button class="shift-chip" data-shift="afternoon" onclick="setShift('afternoon')">Afternoon</button>
  <input type="text" class="search-box" id="search-input" placeholder="Search rooms..." oninput="onSearch(this.value)">
</div>

<div class="room-list" id="room-list"></div>
<div class="add-room-btn" onclick="addRoom()">+ Add Room</div>

<div class="empty-state" id="empty-state">
  <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
  <div class="empty-msg" id="empty-msg">No rooms match your search.</div>
</div>

<div class="toast" id="toast"></div>

<button class="mic-fab" id="mic-fab" title="Hold to speak">
  <svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
</button>

<div class="modal-overlay" id="assign-overlay" onclick="closeAssignModal(event)">
  <div class="modal-sheet" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <span class="modal-title" id="assign-title">Assign Room</span>
      <button class="modal-close" onclick="closeAssignModal()">&times;</button>
    </div>
    <div class="modal-section-title">Staff & Shift</div>
    <div class="modal-assign-row">
      <select id="assign-staff" onchange="onAssignChange()"><option value="">Unassigned</option></select>
      <select id="assign-shift" onchange="onAssignChange()">
        <option value="morning">Morning</option>
        <option value="afternoon">Afternoon</option>
      </select>
    </div>
  </div>
</div>

<div class="panel-overlay" id="staff-overlay" onclick="closeStaffPanel(event)">
  <div class="panel" onclick="event.stopPropagation()">
    <div class="panel-header">
      <span class="panel-title">Staff Members</span>
      <button class="modal-close" onclick="closeStaffPanel()">&times;</button>
    </div>
    <div class="panel-body">
      <div id="staff-list"></div>
      <div class="add-staff-row">
        <input type="text" class="add-staff-input" id="add-staff-input"
          placeholder="Add staff member..." onkeydown="if(event.key==='Enter') addStaff()">
        <button class="btn btn-pk btn-sm" onclick="addStaff()">Add</button>
      </div>
    </div>
  </div>
</div>

<div class="panel-overlay" id="dialog-overlay" onclick="closeDialog(event)">
  <div class="panel" onclick="event.stopPropagation()" style="max-width:340px">
    <div class="panel-header">
      <span class="panel-title" id="dialog-title"></span>
      <button class="modal-close" onclick="closeDialog()">&times;</button>
    </div>
    <div class="panel-body">
      <div id="dialog-message" style="font-size:13px;color:var(--text-secondary);margin-bottom:10px"></div>
      <div id="dialog-select-wrap" style="display:none;margin-bottom:10px">
        <select id="dialog-select" style="width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-size:13px;font-family:var(--font-body);outline:none"></select>
      </div>
      <input type="text" id="dialog-input" style="display:none;width:100%;padding:8px 12px;border:1.5px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:13px;font-family:var(--font-body);outline:none;margin-bottom:10px" onkeydown="if(event.key==='Enter')dialogOk()">
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button class="btn btn-ghost btn-sm" onclick="closeDialog()">Cancel</button>
        <button class="btn btn-pk btn-sm" id="dialog-ok-btn" onclick="dialogOk()">OK</button>
      </div>
    </div>
  </div>
</div>

<div class="panel-overlay" id="schedule-overlay" onclick="closeSchedulePanel(event)">
  <div class="panel" onclick="event.stopPropagation()">
    <div class="panel-header">
      <span class="panel-title">Today's Schedule</span>
      <button class="modal-close" onclick="closeSchedulePanel()">&times;</button>
    </div>
    <div class="panel-body" id="schedule-body"></div>
  </div>
</div>

<script>
let _dialogResolve = null;
function showDialog(opts) {
  document.getElementById('dialog-title').textContent = opts.title || 'Confirm';
  document.getElementById('dialog-message').textContent = opts.message || '';
  document.getElementById('dialog-message').style.display = opts.message ? '' : 'none';
  const inp = document.getElementById('dialog-input');
  const sel = document.getElementById('dialog-select');
  const selWrap = document.getElementById('dialog-select-wrap');
  const okBtn = document.getElementById('dialog-ok-btn');
  inp.style.display = 'none'; selWrap.style.display = 'none';
  if (opts.input) { inp.style.display = ''; inp.value = opts.defaultValue || ''; inp.placeholder = opts.placeholder || ''; }
  if (opts.options) {
    selWrap.style.display = '';
    sel.innerHTML = opts.options.map((o, i) => '<option value="' + i + '">' + escHtml(o) + '</option>').join('');
  }
  okBtn.textContent = opts.okLabel || 'OK';
  if (opts.danger) { okBtn.className = 'btn btn-sm'; okBtn.style.background = 'var(--red)'; okBtn.style.color = '#fff'; }
  else { okBtn.className = 'btn btn-pk btn-sm'; okBtn.style.background = ''; okBtn.style.color = ''; }
  document.getElementById('dialog-overlay').classList.add('open');
  if (opts.input) setTimeout(() => { inp.focus(); inp.select(); }, 100);
  return new Promise(resolve => { _dialogResolve = resolve; });
}
function dialogOk() {
  const inp = document.getElementById('dialog-input');
  const sel = document.getElementById('dialog-select');
  const selWrap = document.getElementById('dialog-select-wrap');
  let result = true;
  if (inp.style.display !== 'none') result = inp.value;
  if (selWrap.style.display !== 'none') result = { selected: parseInt(sel.value, 10), text: inp.style.display !== 'none' ? inp.value : null };
  document.getElementById('dialog-overlay').classList.remove('open');
  if (_dialogResolve) { _dialogResolve(result); _dialogResolve = null; }
}
function closeDialog(e) {
  if (e && e.target !== document.getElementById('dialog-overlay')) return;
  document.getElementById('dialog-overlay').classList.remove('open');
  if (_dialogResolve) { _dialogResolve(null); _dialogResolve = null; }
}

const SECTIONS = {
  toddlers: { label: 'Toddlers',          themeColor: '#e91e63' },
  pp:       { label: 'Pre-Primary',        themeColor: '#9c27b0' },
  le:       { label: 'Lower Elementary',   themeColor: '#2e7d32' },
  ue:       { label: 'Upper Elementary',    themeColor: '#1565c0' },
  ms:       { label: 'Middle School',       themeColor: '#e65100' },
  hs:       { label: 'High School',         themeColor: '#00838f' },
  campus:   { label: 'Campus',             themeColor: '#455a64' }
};
const ROOMS = {
  toddlers: [
    { id: 'td1', name: 'Jasmine' }, { id: 'td2', name: 'Freesia' }
  ],
  pp: [
    { id: 'pp1', name: 'Protea' }, { id: 'pp2', name: 'Disa' },
    { id: 'pp3', name: 'Azalea' }, { id: 'pp4', name: 'Cosmos' },
    { id: 'pp5', name: 'Toilet Block' }
  ],
  le: [
    { id: 'le1', name: 'Oak' }, { id: 'le2', name: 'Willow' }, { id: 'le3', name: 'Rooibos' }
  ],
  ue: [
    { id: 'ue1', name: 'Breeze' }, { id: 'ue2', name: 'Newton' }
  ],
  ms: [
    { id: 'ms1', name: 'Hamlet' }, { id: 'ms2', name: 'Alpha' },
    { id: 'ms3', name: 'Mercury' }, { id: 'ms4', name: 'Gravity' }
  ],
  hs: [
    { id: 'hs1', name: 'Iris' }, { id: 'hs2', name: 'Sage' }, { id: 'hs3', name: 'Delta' },
    { id: 'hs4', name: 'B5' }, { id: 'hs5', name: 'B6' }, { id: 'hs6', name: 'B7' },
    { id: 'hs7', name: 'Ivy' }, { id: 'hs8', name: 'Eagle Owl' }, { id: 'hs9', name: 'The Lab' }
  ],
  campus: [
    { id: 'ca1', name: 'Reception' }, { id: 'ca2', name: 'Staffroom G' },
    { id: 'ca3', name: 'Staffroom' }, { id: 'ca4', name: 'Toilet 1' },
    { id: 'ca5', name: 'Toilet 2' }, { id: 'ca6', name: 'Astro & Stoep' }
  ]
};
const CHECKLISTS = {
  toddlers: ['Floors swept & mopped','Tables & desks wiped','Chairs arranged','Whiteboard cleaned','Bins emptied','Windows & sills dusted','Door handles sanitised','Light switches wiped'],
  pp: ['Floors swept & mopped','Tables & desks wiped','Chairs arranged','Whiteboard cleaned','Bins emptied','Windows & sills dusted','Door handles sanitised','Light switches wiped'],
  le: ['Floors swept & mopped','Tables & desks wiped','Chairs arranged','Whiteboard cleaned','Bins emptied','Windows & sills dusted','Door handles sanitised','Light switches wiped'],
  ue: ['Floors swept & mopped','Tables & desks wiped','Chairs arranged','Whiteboard cleaned','Bins emptied','Windows & sills dusted','Door handles sanitised','Light switches wiped'],
  ms: ['Floors swept & mopped','Tables & desks wiped','Chairs arranged','Whiteboard cleaned','Bins emptied','Windows & sills dusted','Door handles sanitised','Light switches wiped'],
  hs: ['Floors swept & mopped','Tables & desks wiped','Chairs arranged','Whiteboard cleaned','Bins emptied','Windows & sills dusted','Door handles sanitised','Light switches wiped'],
  campus: ['Floors swept & mopped','Surfaces wiped & sanitised','Bins emptied','Windows cleaned','Door handles sanitised','Light switches wiped','Furniture & fittings checked','Supplies restocked']
};

const CAMPUSES = {
  lower: { label: 'Lower Campus', themeColor: '#e91e63', sections: ['toddlers', 'pp', 'le', 'ue'] },
  upper: { label: 'Upper Campus', themeColor: '#1565c0', sections: ['ms', 'hs'] },
  support: { label: 'Support Buildings', themeColor: '#546e7a', sections: ['campus'] }
};
let currentCampus = 'lower';
let currentShift = 'all';
let searchQ = '';
let expandedRoomId = null;
let assignRoomId = null;
let checks = {};
let customItems = {};
let staff = [];
let deletedStaffIds = new Set();
let assignments = {};
let editMode = false;
let roomExclusions = {};
let roomEstimates = {};
let toastTimer = null;
let _syncDebounce = null;
function debouncedSync() { clearTimeout(_syncDebounce); _syncDebounce = setTimeout(() => syncUp(), 2000); }

function getToday() { return new Date().toISOString().slice(0, 10); }
function formatDate(iso) {
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('en-AU', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}

function loadChecks() {
  const today = getToday();
  try {
    const raw = localStorage.getItem('ncl_checks_v1');
    if (raw) {
      const all = JSON.parse(raw); checks = all[today] || {};
      const keys = Object.keys(all).sort();
      let changed = false;
      while (keys.length > 7) { delete all[keys.shift()]; changed = true; }
      if (changed) localStorage.setItem('ncl_checks_v1', JSON.stringify(all));
    } else { checks = {}; }
  } catch (e) { checks = {}; }
}
function saveChecks() {
  const today = getToday();
  try {
    const raw = localStorage.getItem('ncl_checks_v1');
    const all = raw ? JSON.parse(raw) : {};
    all[today] = checks;
    localStorage.setItem('ncl_checks_v1', JSON.stringify(all));
  } catch (e) {}
  debouncedSync();
}
function loadCustomItems() { try { const r = localStorage.getItem('ncl_custom_v1'); if (r) customItems = JSON.parse(r); } catch (e) { customItems = {}; } }
function saveCustomItems() { try { localStorage.setItem('ncl_custom_v1', JSON.stringify(customItems)); } catch (e) {} debouncedSync(); }
function loadStaff() { try { const r = localStorage.getItem('ncl_staff_v1'); if (r) staff = JSON.parse(r); } catch (e) { staff = []; } try { const d = localStorage.getItem('ncl_deleted_staff'); if (d) deletedStaffIds = new Set(JSON.parse(d)); } catch (e) {} }
function saveStaff() { try { localStorage.setItem('ncl_staff_v1', JSON.stringify(staff)); localStorage.setItem('ncl_deleted_staff', JSON.stringify([...deletedStaffIds])); } catch (e) {} debouncedSync(); }
function loadAssignments() { try { const r = localStorage.getItem('ncl_assign_v1'); if (r) assignments = JSON.parse(r); } catch (e) { assignments = {}; } }
function saveAssignments() { try { localStorage.setItem('ncl_assign_v1', JSON.stringify(assignments)); } catch (e) {} debouncedSync(); }
function loadRoomExclusions() { try { const r = localStorage.getItem('ncl_excl_v1'); if (r) roomExclusions = JSON.parse(r); } catch (e) { roomExclusions = {}; } }
function saveRoomExclusions() { try { localStorage.setItem('ncl_excl_v1', JSON.stringify(roomExclusions)); } catch (e) {} debouncedSync(); }
function loadRoomEstimates() { try { const r = localStorage.getItem('ncl_est_v1'); if (r) roomEstimates = JSON.parse(r); } catch (e) { roomEstimates = {}; } }
function saveRoomEstimates() { try { localStorage.setItem('ncl_est_v1', JSON.stringify(roomEstimates)); } catch (e) {} debouncedSync(); }
function getRoomEstimate(roomId) { return roomEstimates[roomId] || 15; }
async function editRoomEstimate(roomId, e) {
  if (e) e.stopPropagation();
  if (!editMode) return;
  const current = getRoomEstimate(roomId);
  const val = await showDialog({ title: 'Estimate', message: 'Cleaning time (minutes):', input: true, defaultValue: String(current) });
  if (val === null) return;
  const mins = parseInt(val.trim(), 10);
  if (isNaN(mins) || mins < 1) { showToast('Enter a valid number'); return; }
  roomEstimates[roomId] = mins;
  saveRoomEstimates(); render(); showToast('Updated to ' + mins + ' min');
}

function getChecklistForRoom(roomId) {
  const section = getRoomSection(roomId);
  const excl = roomExclusions[roomId] || [];
  const preset = (CHECKLISTS[section] || []).filter(item => !excl.includes(item));
  const custom = (customItems[section] || []).filter(item => !excl.includes(item));
  return [...preset, ...custom];
}
function getRoomSection(roomId) {
  for (const [sid, rooms] of Object.entries(ROOMS)) { if (rooms.some(r => r.id === roomId)) return sid; }
  return CAMPUSES[currentCampus].sections[0];
}
function isChecked(roomId, idx) { return checks[roomId] && checks[roomId].includes(idx); }
function getCheckTime(roomId, idx) {
  try {
    const raw = localStorage.getItem('ncl_times_v1'); if (!raw) return '';
    const times = JSON.parse(raw); const today = getToday();
    return (times[today] && times[today][roomId] && times[today][roomId][idx]) || '';
  } catch (e) { return ''; }
}
function setCheckTime(roomId, idx) {
  const today = getToday();
  try {
    const raw = localStorage.getItem('ncl_times_v1');
    const times = raw ? JSON.parse(raw) : {};
    if (!times[today]) times[today] = {};
    if (!times[today][roomId]) times[today][roomId] = {};
    times[today][roomId][idx] = new Date().toLocaleTimeString('en-AU', { hour: '2-digit', minute: '2-digit' });
    localStorage.setItem('ncl_times_v1', JSON.stringify(times));
  } catch (e) {}
}
function toggleCheck(roomId, idx) {
  if (!checks[roomId]) checks[roomId] = [];
  const i = checks[roomId].indexOf(idx);
  if (i === -1) { checks[roomId].push(idx); setCheckTime(roomId, idx); }
  else { checks[roomId].splice(i, 1); }
  saveChecks();
}
function getRoomProgress(roomId) {
  const total = getChecklistForRoom(roomId).length;
  const done = checks[roomId] ? checks[roomId].filter(i => i < total).length : 0;
  return { done, total };
}
function getRoomCompletedAt(roomId) {
  try {
    const raw = localStorage.getItem('ncl_times_v1'); if (!raw) return '';
    const times = JSON.parse(raw); const today = getToday();
    const rt = times[today] && times[today][roomId];
    if (!rt) return '';
    let latest = '';
    Object.values(rt).forEach(t => { if (t > latest) latest = t; });
    return latest;
  } catch (e) { return ''; }
}

function renderSectionTabs() {
  const container = document.getElementById('section-tabs');
  container.innerHTML = Object.entries(CAMPUSES).map(([id, c]) => {
    let totalRooms = 0, completeRooms = 0;
    c.sections.forEach(sid => {
      (ROOMS[sid] || []).forEach(r => {
        totalRooms++;
        const p = getRoomProgress(r.id);
        if (p.done === p.total && p.total > 0) completeRooms++;
      });
    });
    const remaining = totalRooms - completeRooms;
    return '<button class="section-tab' + (id === currentCampus ? ' active' : '') +
      '" onclick="switchCampus(\'' + id + '\')">' +
      c.label + '<span class="tab-badge">' + remaining + '</span></button>';
  }).join('');
}

function switchCampus(campusId) {
  if (campusId === currentCampus) return;
  currentCampus = campusId; searchQ = ''; expandedRoomId = null;
  document.getElementById('search-input').value = '';
  document.documentElement.setAttribute('data-section', campusId);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', CAMPUSES[campusId].themeColor);
  document.getElementById('logo-sub').textContent = CAMPUSES[campusId].label;
  try { localStorage.setItem('ncl_section', campusId); } catch (e) {}
  render();
}

function setShift(shift) {
  currentShift = shift;
  document.querySelectorAll('.shift-chip').forEach(b => b.classList.toggle('active', b.dataset.shift === shift));
  render();
}
function onSearch(q) { searchQ = q.toLowerCase().trim(); render(); }

function getCampusRooms() {
  const campus = CAMPUSES[currentCampus];
  if (!campus) return [];
  const result = [];
  campus.sections.forEach(sid => {
    (ROOMS[sid] || []).forEach(r => result.push({ ...r, section: sid }));
  });
  return result;
}
function getFilteredRooms() {
  let rooms = getCampusRooms();
  if (searchQ) rooms = rooms.filter(r => r.name.toLowerCase().includes(searchQ));
  if (currentShift !== 'all') rooms = rooms.filter(r => { const a = assignments[r.id]; return a && a.shift === currentShift; });
  return rooms;
}

function render() { renderSectionTabs(); updateStats(); renderRoomList(); }

function updateStats() {
  document.getElementById('stats-date').innerHTML = formatDate(getToday());
  const rooms = getCampusRooms();
  let totalItems = 0, doneItems = 0;
  rooms.forEach(r => {
    const p = getRoomProgress(r.id);
    totalItems += p.total; doneItems += p.done;
  });
  const pct = totalItems > 0 ? Math.round(doneItems / totalItems * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-label').textContent = doneItems + '/' + totalItems + ' (' + pct + '%)';
}

function renderRoomList() {
  const rooms = getFilteredRooms();
  const list = document.getElementById('room-list');
  const empty = document.getElementById('empty-state');
  if (rooms.length === 0) {
    list.innerHTML = '';
    empty.classList.add('visible');
    document.getElementById('empty-msg').textContent = searchQ ? 'No rooms match "' + searchQ + '".' : 'No rooms in this shift.';
    return;
  }
  empty.classList.remove('visible');
  const circ = 2 * Math.PI * 14;

  let lastSection = null;
  list.innerHTML = rooms.map(room => {
    let headerHtml = '';
    if (room.section !== lastSection) {

async function exportCSV() {
  const headers = ['Section','Room','Checklist Item','Status','Completed At','Assigned To','Shift'];
  const rows = [headers];
  for (const [sid, rooms] of Object.entries(ROOMS)) {
    rooms.forEach(room => {

      items.forEach((item, idx) => {

  }
  const csv = rows.map(r => r.map(c => '"' + String(c).replace(/"/g,'""') + '"').join(',')).join('\n');
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
  const fileName = 'NewberryCleaning_' + getToday() + '.csv';
  if (navigator.share && navigator.canShare) {

function loadRooms() {
  try {
    const raw = localStorage.getItem('ncl_rooms_v1');
    if (raw) {
      const saved = JSON.parse(raw);
      for (const [k, v] of Object.entries(saved)) {
        if (!ROOMS[k]) continue;
        const savedNames = new Set(v.map(r => r.name.toLowerCase()));
        const missing = ROOMS[k].filter(r => !savedNames.has(r.name.toLowerCase()));
        const merged = [...v, ...missing];
        const seen = new Set();
        ROOMS[k] = merged.filter(r => { const n = r.name.toLowerCase(); if (seen.has(n)) return false; seen.add(n); return true; });
      }
    }
  } catch (e) {}
}

async function deleteChecklistItem(roomId, idx) {
  const items = getChecklistForRoom(roomId);
  const itemName = items[idx];
  if (!itemName) return;
  const section = getRoomSection(roomId);
  const room = findRoom(roomId);
  const roomLabel = room ? room.name : roomId;
  const sectionLabel = SECTIONS[section] ? SECTIONS[section].label : section;
  const result = await showDialog({
    title: 'Remove Item', message: 'Remove "' + itemName + '"?',

    okLabel: 'Remove', danger: true
  });
  if (result === null) return;

  if (opt === 0) {
    if (!roomExclusions[roomId]) roomExclusions[roomId] = [];

    saveRoomExclusions();
    if (checks[roomId]) {
      checks[roomId] = checks[roomId].filter(i => i < idx).concat(checks[roomId].filter(i => i > idx).map(i => i - 1));
      saveChecks();
    }
    render(); showToast('Removed from ' + roomLabel);
  } else {
    const allPreset = CHECKLISTS[section] || [];
    const presetIdx = allPreset.indexOf(itemName);
    if (presetIdx >= 0) {
      allPreset.splice(presetIdx, 1); savePresetChecklists();
    } else {
      const customList = customItems[section] || [];
      const ci = customList.indexOf(itemName);
      if (ci >= 0) { customList.splice(ci, 1); saveCustomItems(); }
    }
    const sectionRooms = ROOMS[section] || [];
    sectionRooms.forEach(r => {
      if (checks[r.id]) {
        const rItems = getChecklistForRoom(r.id);
        const rIdx = rItems.indexOf(itemName);
        if (rIdx < 0) return;
        checks[r.id] = checks[r.id].filter(i => i < rIdx).concat(checks[r.id].filter(i => i > rIdx).map(i => i - 1));
      }
    });
    saveChecks(); render(); showToast('Removed from all ' + sectionLabel);
  }
}

      const roomTimes = (times[today] && times[today][roomId]) || {};
      checkRows.push({ id: roomId + '_' + today, room_id: roomId, section, date: today,
        checked_indices: JSON.stringify(indices), check_times: JSON.stringify(roomTimes), updated_at: Date.now() });
    }
    if (checkRows.length > 0) await sb.from('cleaning_checks').upsert(checkRows, { onConflict: 'id' });
    const staffRows = staff.filter(s => !deletedStaffIds.has(s.id)).map(s => ({ id: s.id, name: s.name, updated_at: Date.now(), deleted: false }));
    if (staffRows.length > 0) await sb.from('cleaning_staff').upsert(staffRows, { onConflict: 'id' });
    for (const did of deletedStaffIds) { await sb.from('cleaning_staff').update({ deleted: true, updated_at: Date.now() }).eq('id', did); }
    const assignRows = Object.entries(assignments).map(([roomId, a]) => ({ room_id: roomId, staff_name: a.staff || '', shift: a.shift || 'morning', updated_at: Date.now() }));
    if (assignRows.length > 0) await sb.from('cleaning_assignments').upsert(assignRows, { onConflict: 'room_id' });
    await sb.from('cleaning_config').upsert({
      id: 'shared_config',
      rooms: JSON.stringify(ROOMS),
      checklists: JSON.stringify(CHECKLISTS),
      custom_items: JSON.stringify(customItems),
      room_exclusions: JSON.stringify(roomExclusions),
      room_estimates: JSON.stringify(roomEstimates),
      updated_at: Date.now()
    }, { onConflict: 'id' });
    let totalItems = 0, doneItems = 0, completedRooms = 0, totalRooms = 0;
    for (const rooms of Object.values(ROOMS)) {
      rooms.forEach(r => {
        totalRooms++;
        const p = getRoomProgress(r.id);
        totalItems += p.total; doneItems += p.done;
        if (p.done === p.total && p.total > 0) completedRooms++;
      });
    }
    await sb.from('cleaning_daily_summary').upsert({
      id: today, date: today,
      total_rooms: totalRooms, completed_rooms: completedRooms,
      total_items: totalItems, completed_items: doneItems,
      pct: totalItems > 0 ? Math.round(doneItems / totalItems * 100) : 0,
      assignments: JSON.stringify(assignments),
      updated_at: Date.now()
    }, { onConflict: 'id' });
  } catch (e) { console.warn('Sync up failed:', e); }
}

async function syncDown() {
  if (!sb) return;
  try {
    const today = getToday();
    const { data: configData } = await sb.from('cleaning_config').select('*').eq('id', 'shared_config').single();
    if (configData) {
      try {
        const remoteRooms = JSON.parse(configData.rooms || '{}');
        for (const [k, v] of Object.entries(remoteRooms)) {
          if (!ROOMS[k]) { ROOMS[k] = v; continue; }
          const localIds = new Set(ROOMS[k].map(r => r.id));
          const localNames = new Set(ROOMS[k].map(r => r.name.toLowerCase()));
          v.forEach(r => { if (!localIds.has(r.id) && !localNames.has(r.name.toLowerCase())) ROOMS[k].push(r); });
          ROOMS[k].forEach((r, i) => { const remote = v.find(rv => rv.id === r.id); if (remote) ROOMS[k][i].name = remote.name; });
        }
        saveRooms();
        const remoteChecklists = JSON.parse(configData.checklists || '{}');
        for (const [k, v] of Object.entries(remoteChecklists)) { if (CHECKLISTS[k]) CHECKLISTS[k] = v; }
        savePresetChecklists();
        const remoteCustom = JSON.parse(configData.custom_items || '{}');
        for (const [k, v] of Object.entries(remoteCustom)) {
          if (!customItems[k]) customItems[k] = [];
          v.forEach(item => { if (!customItems[k].includes(item)) customItems[k].push(item); });
        }
        saveCustomItems();
        const remoteExcl = JSON.parse(configData.room_exclusions || '{}');
        for (const [k, v] of Object.entries(remoteExcl)) {
          if (!roomExclusions[k]) roomExclusions[k] = [];
          v.forEach(item => { if (!roomExclusions[k].includes(item)) roomExclusions[k].push(item); });
        }
        saveRoomExclusions();
        const remoteEst = JSON.parse(configData.room_estimates || '{}');
        Object.assign(roomEstimates, remoteEst);
        saveRoomEstimates();
      } catch (e) { console.warn('Config merge failed:', e); }
    }
    const { data: checkData } = await sb.from('cleaning_checks').select('*').eq('date', today);
    if (checkData && checkData.length > 0) {
      const timesRaw = localStorage.getItem('ncl_times_v1');
      const allTimes = timesRaw ? JSON.parse(timesRaw) : {};
      if (!allTimes[today]) allTimes[today] = {};
      checkData.forEach(row => {
        const local = checks[row.room_id] || [];
        const remote = JSON.parse(row.checked_indices || '[]');
        checks[row.room_id] = [...new Set([...local, ...remote])].sort((a, b) => a - b);
        const rt = JSON.parse(row.check_times || '{}');
        if (!allTimes[today][row.room_id]) allTimes[today][row.room_id] = {};
        Object.assign(allTimes[today][row.room_id], rt);
      });
      saveChecks();
      try { localStorage.setItem('ncl_times_v1', JSON.stringify(allTimes)); } catch (e) {}
    }
    const { data: staffData } = await sb.from('cleaning_staff').select('*').eq('deleted', false);
    if (staffData) {
      const m = new Map(staff.map(s => [s.id, s]));
      staffData.forEach(r => { if (!m.has(r.id) && !deletedStaffIds.has(r.id)) staff.push({ id: r.id, name: r.name }); });
      staff = staff.filter(s => !deletedStaffIds.has(s.id));
      saveStaff();
    }
    const { data: assignData } = await sb.from('cleaning_assignments').select('*');
    if (assignData) { assignData.forEach(r => { if (!assignments[r.room_id] && r.staff_name) assignments[r.room_id] = { staff: r.staff_name, shift: r.shift }; }); saveAssignments(); }
    render();
  } catch (e) { console.warn('Sync down failed:', e); }
}

(function init() {
  try { const t = localStorage.getItem('ncl_theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  updateThemeIcon();
  try { const s = localStorage.getItem('ncl_section'); if (s && CAMPUSES[s]) currentCampus = s; } catch (e) {}
  document.documentElement.setAttribute('data-section', currentCampus);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', CAMPUSES[currentCampus].themeColor);
  document.getElementById('logo-sub').textContent = CAMPUSES[currentCampus].label;
  loadRooms(); loadPresetChecklists(); loadChecks(); loadCustomItems(); loadStaff(); loadAssignments(); loadRoomExclusions(); loadRoomEstimates();
  render();
  initSupabase();
  if (sb) { syncDown(); startAutoSync(); }
})();
</script>
