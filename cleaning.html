<!DOCTYPE html>
<html lang="en" data-section="toddlers" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1565c0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Newberry Cleaning</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  min-height: 100dvh;
  padding-bottom: env(safe-area-inset-bottom, 20px);
  transition: background .3s, color .3s;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}

:root {
  --bg: #f5f5f0;
  --card: #ffffff;
  --border: #e8e5dd;
  --border-light: #f0ede5;
  --text: #1a1a1a;
  --text-secondary: #555;
  --muted: #888;
  --shadow: 0 1px 3px rgba(0,0,0,.04), 0 1px 2px rgba(0,0,0,.06);
  --shadow-lg: 0 4px 12px rgba(0,0,0,.08);
  --font-head: 'Georgia', 'Times New Roman', serif;
  --font-body: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --badge-bg: rgba(0,0,0,.05);
  --red: #c62828;
  --green: #2e7d32;
  --green-light: rgba(46,125,50,.08);
  --toast-bg: #333;
  --toast-color: #fff;
  --overlay: rgba(0,0,0,.35);
  --radius: 10px;
  --radius-lg: 14px;
}

[data-theme="dark"] {
  --bg: #0e0e0e;
  --card: #1a1a1a;
  --border: #2a2a2a;
  --border-light: #222;
  --text: #e8e6e1;
  --text-secondary: #aaa;
  --muted: #777;
  --shadow: 0 1px 3px rgba(0,0,0,.3);
  --shadow-lg: 0 4px 12px rgba(0,0,0,.4);
  --badge-bg: rgba(255,255,255,.06);
  --green-light: rgba(46,125,50,.15);
  --toast-bg: #e8e6e1;
  --toast-color: #1a1a1a;
  --overlay: rgba(0,0,0,.55);
}

[data-section="toddlers"]    { --pk: #e91e63; --pk-light: rgba(233,30,99,.08); --pk-mid: rgba(233,30,99,.15); --glow: rgba(233,30,99,.35); }
[data-section="pp"]          { --pk: #9c27b0; --pk-light: rgba(156,39,176,.08); --pk-mid: rgba(156,39,176,.15); --glow: rgba(156,39,176,.35); }
[data-section="le"]          { --pk: #2e7d32; --pk-light: rgba(46,125,50,.08); --pk-mid: rgba(46,125,50,.15); --glow: rgba(46,125,50,.35); }
[data-section="ue"]          { --pk: #1565c0; --pk-light: rgba(21,101,192,.08); --pk-mid: rgba(21,101,192,.15); --glow: rgba(21,101,192,.35); }
[data-section="ms"]          { --pk: #e65100; --pk-light: rgba(230,81,0,.08); --pk-mid: rgba(230,81,0,.15); --glow: rgba(230,81,0,.35); }
[data-section="hs"]          { --pk: #00838f; --pk-light: rgba(0,131,143,.08); --pk-mid: rgba(0,131,143,.15); --glow: rgba(0,131,143,.35); }
[data-section="campus"]      { --pk: #455a64; --pk-light: rgba(69,90,100,.08); --pk-mid: rgba(69,90,100,.15); --glow: rgba(69,90,100,.35); }

.app-header {
  padding: calc(14px + env(safe-area-inset-top, 0px)) 16px 10px;
  display: flex; align-items: center; justify-content: space-between;
}
.logo { display: flex; flex-direction: column; }
.logo-title {
  font-family: var(--font-head); font-size: 22px; font-weight: 700;
  color: var(--pk); line-height: 1.1; letter-spacing: -.3px;
}
.logo-sub {
  font-size: 9px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 2.5px; color: var(--muted); margin-top: 2px;
}
.header-actions { display: flex; gap: 4px; align-items: center; }
.header-btn {
  width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid var(--border);
  background: var(--card); color: var(--muted); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all .2s; position: relative;
}
.header-btn:hover { color: var(--text); border-color: var(--pk); }
.header-btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.header-btn.active { background: var(--pk); color: #fff; border-color: var(--pk); }

.overflow-wrap { position: relative; }
.overflow-menu {
  position: absolute; top: 100%; right: 0; margin-top: 6px;
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow-lg); min-width: 160px; z-index: 100;
  display: none; overflow: hidden;
}
.overflow-menu.open { display: block; }
.overflow-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; border: none; background: none; width: 100%;
  font-size: 13px; color: var(--text); cursor: pointer;
  font-family: var(--font-body); transition: background .15s; text-align: left;
}
.overflow-item:hover { background: var(--pk-light); }
.overflow-item svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

.section-tabs {
  display: flex; gap: 3px; padding: 4px 16px 6px;
  overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
}
.section-tabs::-webkit-scrollbar { display: none; }
.section-tab {
  flex: 0 0 auto; display: flex; align-items: center; gap: 5px;
  padding: 6px 10px; border: none; background: transparent; border-radius: 8px;
  cursor: pointer; font-family: var(--font-body); font-size: 10px; font-weight: 700;
  color: var(--muted); text-transform: uppercase; letter-spacing: .3px;
  transition: all .22s; user-select: none; white-space: nowrap;
}
.section-tab .tab-icon { width: 14px; height: 14px; display: block; flex-shrink: 0; }
.section-tab .tab-icon svg { width: 100%; height: 100%; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.section-tab:hover { color: var(--text); background: var(--badge-bg); }
.section-tab.active { background: var(--pk); color: #fff; box-shadow: 0 2px 8px var(--glow); }
.tab-badge {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px;
  font-size: 9px; font-weight: 700; background: var(--badge-bg); color: var(--muted);
}
.section-tab.active .tab-badge { background: rgba(255,255,255,.3); color: #fff; }

.stats-bar { padding: 8px 16px; display: flex; align-items: center; gap: 12px; }
.stats-date { font-size: 13px; font-weight: 600; color: var(--text); }
.stats-progress { flex: 1; display: flex; align-items: center; gap: 8px; }
.progress-track { flex: 1; height: 5px; background: var(--badge-bg); border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--pk); border-radius: 3px; transition: width .4s ease; }
.progress-label { font-size: 11px; font-weight: 700; color: var(--pk); white-space: nowrap; }

.filter-bar { padding: 2px 16px 8px; display: flex; gap: 6px; align-items: center; }
.shift-chip {
  padding: 5px 12px; border-radius: 20px; border: 1.5px solid var(--border);
  background: transparent; font-size: 11px; font-weight: 600; color: var(--muted);
  cursor: pointer; transition: all .2s; font-family: var(--font-body);
}
.shift-chip.active { background: var(--pk); color: #fff; border-color: var(--pk); }
.search-box {
  flex: 1; max-width: 180px; padding: 5px 10px; border: 1.5px solid var(--border);
  border-radius: 20px; background: var(--card); color: var(--text);
  font-size: 12px; font-family: var(--font-body); outline: none; transition: border-color .2s;
}
.search-box:focus { border-color: var(--pk); }
.search-box::placeholder { color: var(--muted); }

.room-list { padding: 0 12px 100px; display: flex; flex-direction: column; gap: 4px; }
.room-card {
  background: var(--card); border: 1px solid var(--border-light);
  border-radius: var(--radius); overflow: hidden; transition: all .2s;
}
.room-card:hover { border-color: var(--border); }
.room-card.expanded { border-color: var(--pk); box-shadow: var(--shadow); }
.room-card.complete { border-left: 3px solid var(--green); }
.room-card.complete.expanded { border-color: var(--green); border-left: 3px solid var(--green); }

.room-card-header {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; cursor: pointer; user-select: none; transition: background .15s;
}
.room-card-header:active { background: var(--pk-light); }
.room-card.complete .room-card-header { background: var(--green-light); }

.room-check-icon {
  width: 20px; height: 20px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.room-card:not(.complete) .room-check-icon { border: 2px solid var(--border); color: transparent; }
.room-card.complete .room-check-icon { background: var(--green); color: #fff; border: none; }
.room-check-icon svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }

.room-info { flex: 1; min-width: 0; }
.room-name {
  font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.2;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.room-subtitle { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
.room-fraction { font-size: 10px; font-weight: 600; color: var(--muted); }
.room-time-badge {
  font-size: 9px; font-weight: 600; color: var(--text-secondary);
  background: var(--badge-bg); border-radius: 10px; padding: 1px 6px;
}
.room-card.complete .room-time-badge { color: var(--green); background: var(--green-light); }
.stats-time { font-size: 11px; color: var(--muted); font-weight: 600; white-space: nowrap; margin-left: auto; }
.room-est-edit {
  display: none; font-size: 10px; color: var(--pk); cursor: pointer;
  background: none; border: 1px dashed var(--pk-mid); border-radius: 4px;
  padding: 1px 6px; font-family: var(--font-body); font-weight: 600;
}
.edit-mode-active .room-est-edit { display: inline-block; }
.room-staff-badge {
  font-size: 9px; font-weight: 600; color: var(--pk);
  background: var(--pk-light); border-radius: 10px; padding: 1px 6px;
}

.room-progress-mini { width: 36px; height: 36px; position: relative; flex-shrink: 0; }
.room-progress-mini svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.room-progress-mini .track { fill: none; stroke: var(--badge-bg); stroke-width: 3; }
.room-progress-mini .fill { fill: none; stroke: var(--pk); stroke-width: 3; stroke-linecap: round; transition: stroke-dashoffset .4s ease; }
.room-card.complete .room-progress-mini .fill { stroke: var(--green); }
.room-progress-mini .pct {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-size: 9px; font-weight: 700; color: var(--muted);
}

.room-chevron {
  width: 20px; height: 20px; color: var(--muted); flex-shrink: 0; transition: transform .2s;
}
.room-card.expanded .room-chevron { transform: rotate(180deg); }
.room-chevron svg { width: 100%; height: 100%; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.room-body {
  max-height: 0; overflow: hidden; transition: max-height .3s ease;
  border-top: 0px solid transparent;
}
.room-card.expanded .room-body { max-height: 800px; border-top: 1px solid var(--border-light); }

.checklist-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 12px; border-bottom: 1px solid var(--border-light);
  cursor: pointer; transition: background .12s; user-select: none;
}
.checklist-item:last-child { border-bottom: none; }
.checklist-item:active { background: var(--pk-light); }
.check-box {
  width: 20px; height: 20px; border-radius: 5px; border: 1.5px solid var(--border);
  flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  transition: all .15s; color: transparent;
}
.checklist-item.checked .check-box { background: var(--pk); border-color: var(--pk); color: #fff; }
.check-box svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.check-label { font-size: 13px; color: var(--text); transition: all .15s; flex: 1; }
.checklist-item.checked .check-label { text-decoration: line-through; color: var(--muted); }
.check-time { font-size: 9px; color: var(--muted); white-space: nowrap; }

.room-actions-bar {
  display: flex; gap: 6px; padding: 8px 12px;
  border-top: 1px solid var(--border-light); align-items: center; flex-wrap: wrap;
}
.room-actions-bar .btn { font-size: 11px; padding: 5px 10px; }

.edit-item-actions { display: none; gap: 4px; margin-left: auto; }
.edit-mode-active .edit-item-actions { display: flex; }
.edit-item-actions button {
  padding: 2px 6px; border-radius: 4px; border: 1px solid var(--border);
  background: var(--card); color: var(--muted); font-size: 10px;
  cursor: pointer; font-family: var(--font-body);
}
.edit-item-actions .edit-del-item { color: var(--red); }
.edit-room-actions { display: none; gap: 4px; }
.edit-mode-active .edit-room-actions { display: flex; }
.edit-room-actions button {
  padding: 3px 8px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--card); color: var(--muted); font-size: 10px; font-weight: 600;
  font-family: var(--font-body); cursor: pointer; transition: all .15s;
}
.edit-room-actions button:hover { color: var(--text); border-color: var(--text); }
.edit-room-actions .edit-delete-room { color: var(--red); }

.add-room-btn {
  display: none; background: var(--badge-bg); border: 2px dashed var(--border);
  border-radius: var(--radius); padding: 12px; cursor: pointer; text-align: center;
  color: var(--muted); font-size: 13px; font-weight: 600;
  transition: all .2s; margin: 4px 12px 8px;
}
.add-room-btn:hover { border-color: var(--pk); color: var(--pk); }
.edit-mode-active .add-room-btn { display: block; }

.add-checklist-row { display: none; padding: 6px 12px; gap: 6px; }
.edit-mode-active .add-checklist-row { display: flex; }
.add-checklist-input {
  flex: 1; padding: 6px 10px; border: 1.5px solid var(--border); border-radius: 6px;
  background: var(--bg); color: var(--text); font-size: 12px;
  font-family: var(--font-body); outline: none;
}
.add-checklist-input:focus { border-color: var(--pk); }

.edit-banner {
  display: none; padding: 6px 16px; background: rgba(230,81,0,.08);
  font-size: 11px; font-weight: 600; color: #e65100; text-align: center; letter-spacing: .2px;
}
.edit-mode-active .edit-banner { display: block; }

.btn {
  padding: 7px 14px; border-radius: 7px; border: none; font-size: 12px;
  font-weight: 600; font-family: var(--font-body); cursor: pointer;
  transition: all .15s; display: inline-flex; align-items: center; gap: 5px;
}
.btn-pk { background: var(--pk); color: #fff; }
.btn-pk:hover { filter: brightness(1.1); }
.btn-ghost { background: transparent; color: var(--muted); border: 1.5px solid var(--border); }
.btn-ghost:hover { color: var(--text); border-color: var(--text); }
.btn-sm { padding: 4px 8px; font-size: 11px; }
.btn-green { background: var(--green); color: #fff; }
.btn-assign { background: var(--pk-light); color: var(--pk); border: 1px solid var(--pk-mid); }

.panel-overlay {
  position: fixed; inset: 0; z-index: 1000; background: var(--overlay);
  display: none; align-items: center; justify-content: center; padding: 16px;
}
.panel-overlay.open { display: flex; }
.panel {
  background: var(--card); border-radius: var(--radius-lg); width: 100%; max-width: 420px;
  max-height: 80dvh; overflow-y: auto; animation: fadeIn .2s ease;
}
@keyframes fadeIn { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: scale(1); } }
.panel-header {
  padding: 14px 16px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.panel-title { font-size: 15px; font-weight: 700; }
.panel-body { padding: 8px 16px 16px; }
.staff-row {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 0; border-bottom: 1px solid var(--border-light);
}
.staff-row:last-child { border-bottom: none; }
.staff-name { flex: 1; font-size: 13px; font-weight: 600; }
.staff-count { font-size: 11px; color: var(--muted); }
.staff-remove {
  width: 24px; height: 24px; border: none; background: rgba(198,40,40,.08);
  border-radius: 50%; color: var(--red); cursor: pointer; font-size: 12px;
  display: flex; align-items: center; justify-content: center;
}
.add-staff-row { display: flex; gap: 8px; margin-top: 10px; }
.add-staff-input {
  flex: 1; padding: 8px 12px; border: 1.5px solid var(--border); border-radius: 8px;
  background: var(--bg); color: var(--text); font-size: 13px;
  font-family: var(--font-body); outline: none;
}
.add-staff-input:focus { border-color: var(--pk); }
.add-staff-input::placeholder { color: var(--muted); }

.schedule-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.schedule-table th {
  text-align: left; padding: 8px 6px; font-size: 10px; text-transform: uppercase;
  letter-spacing: .5px; color: var(--muted); border-bottom: 1.5px solid var(--border);
}
.schedule-table td { padding: 6px; border-bottom: 1px solid var(--border-light); color: var(--text); }
.schedule-table .sched-room { font-weight: 600; }
.schedule-table .sched-staff { color: var(--pk); }

.modal-overlay {
  position: fixed; inset: 0; z-index: 1000; background: var(--overlay);
  display: none; align-items: flex-end; justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal-sheet {
  background: var(--card); border-radius: 14px 14px 0 0;
  width: 100%; max-width: 500px; overflow-y: auto; padding: 0;
  animation: slideUp .25s ease;
}
@keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.modal-handle { width: 36px; height: 4px; border-radius: 2px; background: var(--border); margin: 10px auto 0; }
.modal-header {
  padding: 10px 16px 8px; display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--border);
}
.modal-title { font-size: 15px; font-weight: 700; color: var(--text); }
.modal-close {
  width: 28px; height: 28px; border: none; background: var(--badge-bg);
  border-radius: 50%; color: var(--muted); cursor: pointer; font-size: 15px;
  display: flex; align-items: center; justify-content: center;
}
.modal-close:hover { background: var(--border); color: var(--text); }
.modal-section-title {
  font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px;
  color: var(--muted); padding: 10px 16px 4px;
}
.modal-assign-row { display: flex; gap: 8px; padding: 8px 16px 14px; }
.modal-assign-row select {
  flex: 1; padding: 8px 10px; border: 1.5px solid var(--border);
  border-radius: 8px; background: var(--card); color: var(--text);
  font-size: 13px; font-family: var(--font-body); outline: none;
}
.modal-assign-row select:focus { border-color: var(--pk); }

.empty-state { text-align: center; padding: 50px 20px; color: var(--muted); display: none; }
.empty-state.visible { display: block; }
.empty-state svg { width: 40px; height: 40px; stroke: var(--muted); fill: none; stroke-width: 1.2; margin-bottom: 10px; }
.empty-msg { font-size: 13px; line-height: 1.5; }

.toast {
  position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--toast-bg); color: var(--toast-color);
  padding: 8px 18px; border-radius: 8px; font-size: 12px; font-weight: 600;
  box-shadow: 0 4px 16px rgba(0,0,0,.2); opacity: 0; transition: all .25s;
  z-index: 2000; pointer-events: none; white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.mic-fab {
  position: fixed; bottom: 20px; right: 16px; width: 50px; height: 50px;
  border-radius: 50%; border: none; background: var(--pk);
  color: #fff; cursor: pointer; box-shadow: 0 3px 12px var(--glow);
  display: flex; align-items: center; justify-content: center;
  z-index: 900; transition: transform .15s;
}
.mic-fab:active { transform: scale(.92); }
.mic-fab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.mic-fab.recording { background: var(--red); animation: pulse 1s infinite; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(198,40,40,.5); } 50% { box-shadow: 0 0 0 12px rgba(198,40,40,0); } }

@media print {
  .app-header, .section-tabs, .filter-bar, .mic-fab, .toast,
  .header-actions, .modal-overlay, .panel-overlay, .room-actions-bar,
  .edit-banner, .add-room-btn { display: none !important; }
  body { background: #fff; color: #000; }
  .room-card { break-inside: avoid; border: 1px solid #ccc; }
  .room-body { max-height: none !important; }
}
</style>
</head>
<body>

<header class="app-header">
  <div class="logo">
    <div class="logo-title">Newberry<span style="font-weight:400">Cleaning</span></div>
    <div class="logo-sub" id="logo-sub">Classrooms</div>
  </div>
  <div class="header-actions">
    <button class="header-btn" title="Staff" onclick="openStaffPanel()">

<script>
const SECTION_ICONS = {
  toddlers: '<svg viewBox="0 0 24 24"><circle cx="12" cy="4" r="2"/><path d="M12 6v6"/><path d="M9 9h6"/><path d="M10 12l-2 8"/><path d="M14 12l2 8"/>',
  pp: '<svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7z"/><circle cx="12" cy="9" r="2.5"/>',
  le: '<svg viewBox="0 0 24 24"><path d="M12 22c-4-2-8-6-8-11a8 8 0 0 1 16 0c0 5-4 9-8 11z"/><path d="M12 2v10"/><path d="M8 8c2 1 4 1 4 4"/><path d="M16 8c-2 1-4 1-4 4"/>',
  ue: '<svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
  ms: '<svg viewBox="0 0 24 24"><polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5"/><line x1="12" y1="22" x2="12" y2="15.5"/><polyline points="22 8.5 12 15.5 2 8.5"/>',
  hs: '<svg viewBox="0 0 24 24"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c0 2 3 3 6 3s6-1 6-3v-5"/>',
  campus: '<svg viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="9" y1="6" x2="15" y2="6"/><line x1="9" y1="10" x2="15" y2="10"/><line x1="9" y1="14" x2="15" y2="14"/><line x1="9" y1="18" x2="15" y2="18"/>'
};
const SECTIONS = {
  toddlers: { label: 'Toddlers',          themeColor: '#e91e63', estMin: 15 },
  pp:       { label: 'Pre-Primary',        themeColor: '#9c27b0', estMin: 15 },
  le:       { label: 'Lower Elementary',   themeColor: '#2e7d32', estMin: 15 },
  ue:       { label: 'Upper Elementary',    themeColor: '#1565c0', estMin: 15 },
  ms:       { label: 'Middle School',       themeColor: '#e65100', estMin: 15 },
  hs:       { label: 'High School',         themeColor: '#00838f', estMin: 15 },
  campus:   { label: 'Campus',             themeColor: '#455a64', estMin: 20 }
};
const ROOMS = {
  toddlers: [
    { id: 'td1', name: 'Jasmine' }, { id: 'td2', name: 'Freesia' }
  ],
  pp: [
    { id: 'pp1', name: 'Protea' }, { id: 'pp2', name: 'Disa' },
    { id: 'pp3', name: 'Azalea' }, { id: 'pp4', name: 'Cosmos' }
  ],
  le: [
    { id: 'le1', name: 'Oak' }, { id: 'le2', name: 'Willow' }, { id: 'le3', name: 'Rooibos' }
  ],
  ue: [
    { id: 'ue1', name: 'Breeze' }, { id: 'ue2', name: 'Newton' }
  ],
  ms: [
    { id: 'ms1', name: 'Hamlet' }, { id: 'ms2', name: 'Alpha' },
    { id: 'ms3', name: 'Mercury' }, { id: 'ms4', name: 'Gravity' }
  ],
  hs: [
    { id: 'hs1', name: 'Iris' }, { id: 'hs2', name: 'Sage' }, { id: 'hs3', name: 'Delta' },
    { id: 'hs4', name: 'B5' }, { id: 'hs5', name: 'B6' }, { id: 'hs6', name: 'B7' },
    { id: 'hs7', name: 'Ivy' }, { id: 'hs8', name: 'Eagle Owl' }, { id: 'hs9', name: 'The Lab' }
  ],
  campus: [
    { id: 'ca1', name: 'Reception' }, { id: 'ca2', name: 'Staffroom G' },
    { id: 'ca3', name: 'Staffroom' }, { id: 'ca4', name: 'Toilet 1' },
    { id: 'ca5', name: 'Toilet 2' }, { id: 'ca6', name: 'Astro & Stoep' }
  ]
};
const CHECKLISTS = {
  toddlers: ['Floors swept & mopped','Tables & desks wiped','Chairs arranged','Whiteboard cleaned','Bins emptied','Windows & sills dusted','Door handles sanitised','Light switches wiped'],
  pp: ['Floors swept & mopped','Tables & desks wiped','Chairs arranged','Whiteboard cleaned','Bins emptied','Windows & sills dusted','Door handles sanitised','Light switches wiped'],
  le: ['Floors swept & mopped','Tables & desks wiped','Chairs arranged','Whiteboard cleaned','Bins emptied','Windows & sills dusted','Door handles sanitised','Light switches wiped'],
  ue: ['Floors swept & mopped','Tables & desks wiped','Chairs arranged','Whiteboard cleaned','Bins emptied','Windows & sills dusted','Door handles sanitised','Light switches wiped'],
  ms: ['Floors swept & mopped','Tables & desks wiped','Chairs arranged','Whiteboard cleaned','Bins emptied','Windows & sills dusted','Door handles sanitised','Light switches wiped'],
  hs: ['Floors swept & mopped','Tables & desks wiped','Chairs arranged','Whiteboard cleaned','Bins emptied','Windows & sills dusted','Door handles sanitised','Light switches wiped'],
  campus: ['Floors swept & mopped','Surfaces wiped & sanitised','Bins emptied','Windows cleaned','Door handles sanitised','Light switches wiped','Furniture & fittings checked','Supplies restocked']
};

let currentSection = 'toddlers';
let currentShift = 'all';
let searchQ = '';
let expandedRoomId = null;
let assignRoomId = null;
let checks = {};
let customItems = {};
let staff = [];
let assignments = {};
let editMode = false;
let roomEstimates = {};
let toastTimer = null;
let _syncDebounce = null;
function debouncedSync() { clearTimeout(_syncDebounce); _syncDebounce = setTimeout(() => syncUp(), 2000); }

function getToday() { return new Date().toISOString().slice(0, 10); }
function formatDate(iso) {
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('en-AU', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}

function loadChecks() {
  const today = getToday();
  try {
    const raw = localStorage.getItem('ncl_checks_v1');
    if (raw) {
      const all = JSON.parse(raw); checks = all[today] || {};
      const keys = Object.keys(all).sort();
      let changed = false;
      while (keys.length > 7) { delete all[keys.shift()]; changed = true; }
      if (changed) localStorage.setItem('ncl_checks_v1', JSON.stringify(all));
    } else { checks = {}; }
  } catch (e) { checks = {}; }
}
function saveChecks() {
  const today = getToday();
  try {
    const raw = localStorage.getItem('ncl_checks_v1');
    const all = raw ? JSON.parse(raw) : {};
    all[today] = checks;
    localStorage.setItem('ncl_checks_v1', JSON.stringify(all));
  } catch (e) {}
  debouncedSync();
}
function loadCustomItems() { try { const r = localStorage.getItem('ncl_custom_v1'); if (r) customItems = JSON.parse(r); } catch (e) { customItems = {}; } }
function saveCustomItems() { try { localStorage.setItem('ncl_custom_v1', JSON.stringify(customItems)); } catch (e) {} }
function loadStaff() { try { const r = localStorage.getItem('ncl_staff_v1'); if (r) staff = JSON.parse(r); } catch (e) { staff = []; } }
function saveStaff() { try { localStorage.setItem('ncl_staff_v1', JSON.stringify(staff)); } catch (e) {} debouncedSync(); }
function loadAssignments() { try { const r = localStorage.getItem('ncl_assign_v1'); if (r) assignments = JSON.parse(r); } catch (e) { assignments = {}; } }
function saveAssignments() { try { localStorage.setItem('ncl_assign_v1', JSON.stringify(assignments)); } catch (e) {} debouncedSync(); }
function loadRoomEstimates() { try { const r = localStorage.getItem('ncl_est_v1'); if (r) roomEstimates = JSON.parse(r); } catch (e) { roomEstimates = {}; } }
function saveRoomEstimates() { try { localStorage.setItem('ncl_est_v1', JSON.stringify(roomEstimates)); } catch (e) {} }
function getRoomEstimate(roomId) {
  if (roomEstimates[roomId]) return roomEstimates[roomId];
  const section = getRoomSection(roomId);
  return SECTIONS[section] ? SECTIONS[section].estMin : 15;
}
function formatMinutes(m) {
  if (m < 60) return m + ' min';
  const h = Math.floor(m / 60); const r = m % 60;
  return r > 0 ? h + 'h ' + r + 'm' : h + 'h';
}

function getChecklistForRoom(roomId) {
  const section = getRoomSection(roomId);
  return [...(CHECKLISTS[section] || []), ...(customItems[section] || [])];
}
function getRoomSection(roomId) {
  for (const [sid, rooms] of Object.entries(ROOMS)) { if (rooms.some(r => r.id === roomId)) return sid; }
  return currentSection;
}
function isChecked(roomId, idx) { return checks[roomId] && checks[roomId].includes(idx); }
function getCheckTime(roomId, idx) {
  try {
    const raw = localStorage.getItem('ncl_times_v1'); if (!raw) return '';
    const times = JSON.parse(raw); const today = getToday();
    return (times[today] && times[today][roomId] && times[today][roomId][idx]) || '';
  } catch (e) { return ''; }
}
function setCheckTime(roomId, idx) {
  const today = getToday();
  try {
    const raw = localStorage.getItem('ncl_times_v1');
    const times = raw ? JSON.parse(raw) : {};
    if (!times[today]) times[today] = {};
    if (!times[today][roomId]) times[today][roomId] = {};
    times[today][roomId][idx] = new Date().toLocaleTimeString('en-AU', { hour: '2-digit', minute: '2-digit' });
    localStorage.setItem('ncl_times_v1', JSON.stringify(times));
  } catch (e) {}
}
function toggleCheck(roomId, idx) {
  if (!checks[roomId]) checks[roomId] = [];
  const i = checks[roomId].indexOf(idx);
  if (i === -1) { checks[roomId].push(idx); setCheckTime(roomId, idx); }
  else { checks[roomId].splice(i, 1); }
  saveChecks();
}
function getRoomProgress(roomId) {
  const total = getChecklistForRoom(roomId).length;
  const done = checks[roomId] ? checks[roomId].filter(i => i < total).length : 0;
  return { done, total };
}

function renderSectionTabs() {
  const container = document.getElementById('section-tabs');
  container.innerHTML = Object.entries(SECTIONS).map(([id, s]) => {
    const rooms = ROOMS[id] || [];
    let complete = 0;
    rooms.forEach(r => { const p = getRoomProgress(r.id); if (p.done === p.total && p.total > 0) complete++; });
    const remaining = rooms.length - complete;
    return '<button class="section-tab' + (id === currentSection ? ' active' : '') +
      '" onclick="switchSection(\'' + id + '\')">' +
      '<span class="tab-icon">' + SECTION_ICONS[id] + '</svg></span>' +
      s.label + '<span class="tab-badge">' + remaining + '</span></button>';
  }).join('');
}

function switchSection(sectionId) {
  if (sectionId === currentSection) return;
  currentSection = sectionId; searchQ = ''; expandedRoomId = null;
  document.getElementById('search-input').value = '';
  document.documentElement.setAttribute('data-section', sectionId);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', SECTIONS[sectionId].themeColor);
  document.getElementById('logo-sub').textContent = SECTIONS[sectionId].label;
  try { localStorage.setItem('ncl_section', sectionId); } catch (e) {}
  render();
}

function setShift(shift) {
  currentShift = shift;
  document.querySelectorAll('.shift-chip').forEach(b => b.classList.toggle('active', b.dataset.shift === shift));
  render();
}
function onSearch(q) { searchQ = q.toLowerCase().trim(); render(); }

function getFilteredRooms() {
  let rooms = ROOMS[currentSection] || [];
  if (searchQ) rooms = rooms.filter(r => r.name.toLowerCase().includes(searchQ));
  if (currentShift !== 'all') rooms = rooms.filter(r => { const a = assignments[r.id]; return a && a.shift === currentShift; });
  return rooms;
}

function render() { renderSectionTabs(); updateStats(); renderRoomList(); }

function updateStats() {
  document.getElementById('stats-date').innerHTML = formatDate(getToday());
  const rooms = ROOMS[currentSection] || [];
  let totalItems = 0, doneItems = 0, remainingMin = 0;
  rooms.forEach(r => {
    const p = getRoomProgress(r.id);
    totalItems += p.total; doneItems += p.done;
    if (p.done < p.total) remainingMin += getRoomEstimate(r.id);
  });
  const pct = totalItems > 0 ? Math.round(doneItems / totalItems * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-label').textContent = doneItems + '/' + totalItems + ' (' + pct + '%)';
  document.getElementById('stats-time').textContent = remainingMin > 0 ? '~' + formatMinutes(remainingMin) + ' left' : 'Done';
}

function renderRoomList() {
  const rooms = getFilteredRooms();
  const list = document.getElementById('room-list');
  const empty = document.getElementById('empty-state');
  if (rooms.length === 0) {
    list.innerHTML = '';
    empty.classList.add('visible');
    document.getElementById('empty-msg').textContent = searchQ ? 'No rooms match "' + searchQ + '".' : 'No rooms in this shift.';
    return;
  }
  empty.classList.remove('visible');
  const circ = 2 * Math.PI * 14;

  list.innerHTML = rooms.map(room => {
    const p = getRoomProgress(room.id);
    const pct = p.total > 0 ? Math.round(p.done / p.total * 100) : 0;
    const isComplete = p.done === p.total && p.total > 0;
    const isExpanded = room.id === expandedRoomId;
    const a = assignments[room.id];
    const offset = circ - (pct / 100) * circ;

    let bodyHtml = '';
    if (isExpanded) {
      const items = getChecklistForRoom(room.id);
      bodyHtml = items.map((item, idx) => {
        const checked = isChecked(room.id, idx);
        const time = checked ? getCheckTime(room.id, idx) : '';
        return '<div class="checklist-item' + (checked ? ' checked' : '') +
          '" onclick="event.stopPropagation();onCheckItem(\'' + room.id + '\',' + idx + ')">' +
          '<div class="check-box"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>' +
          '<span class="check-label">' + escHtml(item) + '</span>' +
          (time ? '<span class="check-time">' + time + '</span>' : '') +
          '<span class="edit-item-actions">' +
            '<button onclick="event.stopPropagation();renameChecklistItem(\'' + room.id + '\',' + idx + ')">Edit</button>' +
            '<button class="edit-del-item" onclick="event.stopPropagation();deleteChecklistItem(\'' + room.id + '\',' + idx + ')">&times;</button>' +
          '</span></div>';
      }).join('') +
      '<div class="add-checklist-row">' +
        '<input type="text" class="add-checklist-input" id="acl-' + room.id + '"' +
        ' placeholder="Add item..." onkeydown="if(event.key===\'Enter\') addChecklistItem(\'' + room.id + '\')">' +
        '<button class="btn btn-pk btn-sm" onclick="addChecklistItem(\'' + room.id + '\')">Add</button>' +
      '</div>' +
      '<div class="room-actions-bar">' +
        '<button class="btn btn-ghost btn-sm" onclick="uncheckAll(\'' + room.id + '\')">Reset</button>' +
        '<button class="btn btn-green btn-sm" onclick="checkAll(\'' + room.id + '\')">&#10003; All</button>' +
        '<button class="btn btn-assign btn-sm" onclick="openAssignModal(\'' + room.id + '\')">Assign</button>' +
        '<button class="room-est-edit" onclick="editRoomEstimate(\'' + room.id + '\')" title="Edit time">~' + getRoomEstimate(room.id) + ' min</button>' +
        '<div class="edit-room-actions" style="margin-left:auto">' +
          '<button onclick="renameRoom(\'' + room.id + '\')">Rename</button>' +
          '<button class="edit-delete-room" onclick="deleteRoom(\'' + room.id + '\')">Remove</button>' +
        '</div>' +
      '</div>';
    }

    return '<div class="room-card' + (isComplete ? ' complete' : '') + (isExpanded ? ' expanded' : '') + '">' +
      '<div class="room-card-header" onclick="toggleRoom(\'' + room.id + '\')">' +
        '<div class="room-check-icon"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>' +
        '<div class="room-info">' +
          '<div class="room-name">' + escHtml(room.name) + '</div>' +
          '<div class="room-subtitle">' +
            '<span class="room-fraction">' + p.done + '/' + p.total + '</span>' +
            '<span class="room-time-badge">~' + getRoomEstimate(room.id) + ' min</span>' +
            (a && a.staff ? '<span class="room-staff-badge">' + escHtml(a.staff) + '</span>' : '') +
          '</div>' +
        '</div>' +
        '<div class="room-progress-mini">' +
          '<svg viewBox="0 0 32 32"><circle class="track" cx="16" cy="16" r="14"/>' +
          '<circle class="fill" cx="16" cy="16" r="14" stroke-dasharray="' + circ + '" stroke-dashoffset="' + offset + '"/></svg>' +
          '<span class="pct">' + pct + '%</span>' +
        '</div>' +
        '<div class="room-chevron"><svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg></div>' +
      '</div>' +
      '<div class="room-body">' + bodyHtml + '</div>' +
    '</div>';
  }).join('');
}

function toggleRoom(roomId) {
  expandedRoomId = expandedRoomId === roomId ? null : roomId;
  renderRoomList();
  if (expandedRoomId) {
    setTimeout(() => {
      const el = document.querySelector('.room-card.expanded');
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }, 50);
  }
}

function openSchedulePanel() {
  const body = document.getElementById('schedule-body');
  const all = [];
  for (const [sid, rooms] of Object.entries(ROOMS)) {
    rooms.forEach(r => { const a = assignments[r.id]; if (a && a.staff) all.push({ section: SECTIONS[sid].label, room: r.name, staff: a.staff, shift: a.shift }); });
  }
  if (all.length === 0) { body.innerHTML = '<p style="color:var(--muted);font-size:13px;">No assignments yet.</p>'; }
  else {
    const byShift = { morning: [], afternoon: [] };
    all.forEach(a => { if (byShift[a.shift]) byShift[a.shift].push(a); });
    let html = '';
    for (const [shift, items] of Object.entries(byShift)) {
      if (items.length === 0) continue;
      html += '<div class="modal-section-title" style="padding-left:0">' + shift.charAt(0).toUpperCase() + shift.slice(1) + ' Shift</div>';
      html += '<table class="schedule-table"><thead><tr><th>Room</th><th>Section</th><th>Staff</th></tr></thead><tbody>';
      items.forEach(a => { html += '<tr><td class="sched-room">' + escHtml(a.room) + '</td><td>' + escHtml(a.section) + '</td><td class="sched-staff">' + escHtml(a.staff) + '</td></tr>'; });

    }

let holdActive = false, recognition = null;
function startMic() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { showToast('Speech not supported'); return; }
  recognition = new SR(); recognition.lang = 'en-AU'; recognition.interimResults = false;
  recognition.onresult = function (e) {
    const text = e.results[0][0].transcript.trim();
    if (text) { if (!customItems[currentSection]) customItems[currentSection] = []; customItems[currentSection].push(text); saveCustomItems(); render(); showToast('Added: ' + text); }
  };
  recognition.onerror = function () { showToast('Could not hear, try again'); };
  recognition.onend = function () { document.getElementById('mic-fab').classList.remove('recording'); };
  recognition.start(); document.getElementById('mic-fab').classList.add('recording');
}
function stopMic() { holdActive = false; if (recognition) { recognition.stop(); recognition = null; } }
(function () {
  const fab = document.getElementById('mic-fab');
  function onPress(e) { e.preventDefault(); holdActive = true; startMic(); }
  function onRelease(e) { e.preventDefault(); if (holdActive) stopMic(); }
  fab.addEventListener('touchstart', onPress, { passive: false });
  fab.addEventListener('touchend', onRelease, { passive: false });
  fab.addEventListener('touchcancel', onRelease, { passive: false });
  fab.addEventListener('mousedown', onPress);
  fab.addEventListener('mouseup', onRelease);
  fab.addEventListener('mouseleave', function () { if (holdActive) stopMic(); });
})();

function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function findRoom(roomId) { for (const rooms of Object.values(ROOMS)) { const r = rooms.find(r => r.id === roomId); if (r) return r; } return null; }

function exportCSV() {
  const headers = ['Section','Room','Checklist Item','Status','Completed At','Assigned To','Shift'];
  const rows = [headers];
  for (const [sid, rooms] of Object.entries(ROOMS)) {
    rooms.forEach(room => {
      const items = getChecklistForRoom(room.id); const a = assignments[room.id];
      items.forEach((item, idx) => {
        const checked = isChecked(room.id, idx); const time = checked ? getCheckTime(room.id, idx) : '';
        rows.push([SECTIONS[sid].label, room.name, item, checked ? 'Done' : 'Pending', time,
          a && a.staff ? a.staff : '', a && a.shift ? a.shift.charAt(0).toUpperCase() + a.shift.slice(1) : '']);
      });
    });
  }
  const csv = rows.map(r => r.map(c => '"' + String(c).replace(/"/g,'""') + '"').join(',')).join('\n');
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob); const a = document.createElement('a');
  a.href = url; a.download = 'NewberryCleaning_' + getToday() + '.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url); showToast('CSV exported');
}

function editRoomEstimate(roomId) {

  const name = prompt('Rename room:', room.name);

}
function deleteRoom(roomId) {
  const room = findRoom(roomId); if (!room) return;
  if (!confirm('Remove "' + room.name + '"?')) return;
  const section = getRoomSection(roomId);
  ROOMS[section] = ROOMS[section].filter(r => r.id !== roomId);
  delete checks[roomId]; delete assignments[roomId];
  if (expandedRoomId === roomId) expandedRoomId = null;
  saveRooms(); saveChecks(); saveAssignments(); render(); showToast('Room removed');

function addRoom() {

function saveRooms() { try { localStorage.setItem('ncl_rooms_v1', JSON.stringify(ROOMS)); } catch (e) {} }
function loadRooms() {
  try { const raw = localStorage.getItem('ncl_rooms_v1'); if (raw) { const saved = JSON.parse(raw); for (const [k, v] of Object.entries(saved)) { if (ROOMS[k]) ROOMS[k] = v; } } } catch (e) {}
}

function renameChecklistItem(roomId, idx) {
  const items = getChecklistForRoom(roomId);
  const name = prompt('Edit item:', items[idx]);
  if (name === null || !name.trim()) return;
  const section = getRoomSection(roomId);
  const preset = CHECKLISTS[section] || [];
  if (idx < preset.length) { preset[idx] = name.trim(); savePresetChecklists(); }
  else { const ci = idx - preset.length; if (customItems[section] && customItems[section][ci] !== undefined) { customItems[section][ci] = name.trim(); saveCustomItems(); } }
  render(); showToast('Item updated');
}
function deleteChecklistItem(roomId, idx) {
  const section = getRoomSection(roomId);
  const preset = CHECKLISTS[section] || [];
  if (idx < preset.length) {
    if (!confirm('Remove "' + preset[idx] + '" from all ' + SECTIONS[section].label + '?')) return;
    preset.splice(idx, 1); savePresetChecklists();
  } else {
    const ci = idx - preset.length;
    if (customItems[section]) { customItems[section].splice(ci, 1); saveCustomItems(); }
  }
  Object.keys(checks).forEach(rid => {
    if (getRoomSection(rid) === section && checks[rid]) {
      checks[rid] = checks[rid].filter(i => i < idx).concat(checks[rid].filter(i => i > idx).map(i => i - 1));
    }
  });
  saveChecks(); render(); showToast('Item removed');
}
function addChecklistItem(roomId) {
  const input = document.getElementById('acl-' + roomId); if (!input) return;
  const text = input.value.trim(); if (!text) return;
  const section = getRoomSection(roomId);
  if (!customItems[section]) customItems[section] = [];
  customItems[section].push(text); input.value = '';
  saveCustomItems(); render(); showToast('Item added');
}
function savePresetChecklists() { try { localStorage.setItem('ncl_presets_v1', JSON.stringify(CHECKLISTS)); } catch (e) {} }
function loadPresetChecklists() {

}

function initSupabase() { try { if (window.supabase && window.supabase.createClient) sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } catch (e) { sb = null; } }
function startAutoSync() { if (syncInterval) clearInterval(syncInterval); syncInterval = setInterval(() => { syncUp(); syncDown(); }, 30000); }

async function syncUp() {
  if (!sb) return;
  try {
    const today = getToday();
    const checkRows = [];
    for (const [roomId, indices] of Object.entries(checks)) {
      const section = getRoomSection(roomId);
      const timesRaw = localStorage.getItem('ncl_times_v1');
      const times = timesRaw ? JSON.parse(timesRaw) : {};
      const roomTimes = (times[today] && times[today][roomId]) || {};
      checkRows.push({ id: roomId + '_' + today, room_id: roomId, section, date: today,
        checked_indices: JSON.stringify(indices), check_times: JSON.stringify(roomTimes), updated_at: Date.now() });
    }
    if (checkRows.length > 0) await sb.from('cleaning_checks').upsert(checkRows, { onConflict: 'id' });
    const staffRows = staff.map(s => ({ id: s.id, name: s.name, updated_at: Date.now(), deleted: false }));
    if (staffRows.length > 0) await sb.from('cleaning_staff').upsert(staffRows, { onConflict: 'id' });
    const assignRows = Object.entries(assignments).map(([roomId, a]) => ({ room_id: roomId, staff_name: a.staff || '', shift: a.shift || 'morning', updated_at: Date.now() }));
    if (assignRows.length > 0) await sb.from('cleaning_assignments').upsert(assignRows, { onConflict: 'room_id' });
  } catch (e) { console.warn('Sync up failed:', e); }
}

async function syncDown() {
  if (!sb) return;
  try {
    const today = getToday();
    const { data: checkData } = await sb.from('cleaning_checks').select('*').eq('date', today);
    if (checkData && checkData.length > 0) {
      const timesRaw = localStorage.getItem('ncl_times_v1');
      const allTimes = timesRaw ? JSON.parse(timesRaw) : {};
      if (!allTimes[today]) allTimes[today] = {};
      checkData.forEach(row => {
        const local = checks[row.room_id] || [];
        const remote = JSON.parse(row.checked_indices || '[]');
        checks[row.room_id] = [...new Set([...local, ...remote])].sort((a, b) => a - b);
        const rt = JSON.parse(row.check_times || '{}');
        if (!allTimes[today][row.room_id]) allTimes[today][row.room_id] = {};
        Object.assign(allTimes[today][row.room_id], rt);
      });
      saveChecks();
      try { localStorage.setItem('ncl_times_v1', JSON.stringify(allTimes)); } catch (e) {}
    }
    const { data: staffData } = await sb.from('cleaning_staff').select('*').eq('deleted', false);
    if (staffData) { const m = new Map(staff.map(s => [s.id, s])); staffData.forEach(r => { if (!m.has(r.id)) staff.push({ id: r.id, name: r.name }); }); saveStaff(); }
    const { data: assignData } = await sb.from('cleaning_assignments').select('*');
    if (assignData) { assignData.forEach(r => { if (!assignments[r.room_id] && r.staff_name) assignments[r.room_id] = { staff: r.staff_name, shift: r.shift }; }); saveAssignments(); }
    render();
  } catch (e) { console.warn('Sync down failed:', e); }
}

  loadRooms(); loadPresetChecklists(); loadChecks(); loadCustomItems(); loadStaff(); loadAssignments(); loadRoomEstimates();
  render();
  initSupabase();
  if (sb) { syncDown(); startAutoSync(); }
})();
